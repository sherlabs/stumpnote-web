name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint, typecheck, unit tests, secrets scan, dependency audit
      - run: pnpm check
      # DB-free build: no DATABASE_URI, no secrets. Pages render from the code fallback.
      - run: pnpm build
        env:
          DATABASE_URI: ''
